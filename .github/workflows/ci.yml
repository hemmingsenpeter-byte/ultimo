name: Curriculum validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check --input-type=module < platform/app.js
      - run: node tests/test_state.mjs
      - run: node tests/test_portfolio.mjs
      - run: node tests/test_tutor.mjs
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - run: python tools/validate_framework.py
      - run: python tools/validate_content.py
      - run: python tools/build.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
